    # ── Delivery Artefacts ────────────────────────────────────────────────────

    - name: generate-proposal-inputs
      description: "Structured proposal inputs from the readiness assessment."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate structured proposal inputs covering:
