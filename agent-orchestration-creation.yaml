        - Estimated value at risk if readiness gaps are not resolved
        Format as bulleted markdown.

    - name: generate-business-requirements
      description: "Structured business requirements table from the engagement context."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Extract and structure business requirements.
        For each: ID (BR-01…), description, priority (Must Have / Should Have / Nice to Have),
        stakeholder, acceptance condition.
        Format as a markdown table.

    - name: generate-functional-requirements
      description: "Structured functional requirements table."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Extract and structure functional requirements.
        For each: ID (FR-01…), description, priority, category (e.g. Authentication, Integration),
        status (Confirmed / Assumed / Missing).
        Format as a markdown table.

    - name: generate-user-stories
      description: "User stories in As a / I want / So that format with acceptance criteria."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate 5-8 user stories in the format:
        "As a [role], I want to [action] so that [benefit]."
        For each: Story ID, Priority, Acceptance Criteria (2-3 conditions), Notes.
        Base stories on the functional requirements and business objectives in the context.

    - name: generate-epics
      description: "Delivery epics grouped by theme with estimated effort."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate 4-6 delivery epics. For each:
        Epic ID (EP-01…), Title, Description, Goal, Contained User Stories (reference),
        Priority, Estimated Effort (S/M/L/XL).
        Format as markdown sections.

    - name: generate-acceptance-criteria
      description: "Given/When/Then acceptance criteria for the top requirements."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate acceptance criteria for the top 5 critical requirements or issues.
        For each: ID, Title, Given/When/Then format, Pass condition, Fail condition.
        Format as markdown.

    - name: generate-raid-log
      description: "RAID log — Risks, Assumptions, Issues, Dependencies."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate a RAID Log (Risks, Assumptions, Issues, Dependencies).
        For each entry: ID, Category, Description, Owner, Impact (High/Medium/Low),
        Mitigation/Action, Status.
        Format as a markdown table with sections per category.

    - name: generate-assumptions
      description: "Documented assumptions, constraints, and dependencies."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Document engagement assumptions and constraints:
        - Assumptions: things believed to be true but not confirmed
        - Constraints: limitations on the engagement
        - Dependencies: external factors required for delivery
        For each: ID, Description, Owner, Impact if wrong, Validation approach.
        Format as markdown.

    - name: generate-decision-log
      description: "Key decisions made or required, with decision maker and rationale."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate a decision log. For each key decision:
        Decision ID (D-01…), Topic, Decision Made / Required, Decision Maker,
        Date / Target Date, Rationale, Impact if delayed.
        Format as a markdown table.

    - name: generate-next-workshop-agenda
      description: "Timed workshop agenda from open questions and blockers, with owners and decisions required."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate a timed workshop agenda for the next discovery or architecture workshop.
        Base it on openQuestions, criticalIssues, missingStakeholders, and missingWorkshops.
        Format:
        - Workshop Title and Objective
        - Date/Time placeholder
        - Attendees (roles including missing stakeholders)
        - Agenda items: Time (e.g. 09:00-09:15), Topic, Owner, Decision Required (Y/N)
        - Close: Actions and next steps (30 min)
        Format as markdown.

    - name: generate-workshop-minutes
      description: "Workshop minutes template for the upcoming workshop."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate a workshop minutes template. Include:
        Meeting header (Date, Attendees, Facilitator, Scribe, Location),
        Agenda Items discussed (summarised), Decisions Made,
        Actions (Owner, Due Date, Status), Next Meeting date placeholder.
        Mark placeholder fields with [PLACEHOLDER].
        Format as markdown.

    - name: generate-action-tracker
      description: "Complete action tracker from critical issues, recommendations, and open questions."
      trigger: on-demand
      input: [readiness_json, discovery_json]
      instructions: |
        Generate a complete action tracker from all critical issues, recommendations,
        and open questions. For each:
        ID (ACT-01…), Title (verb phrase), Owner Role, Priority, Due Date, Status (Open),
        Description (2 sentences).
        Format as a markdown table.

