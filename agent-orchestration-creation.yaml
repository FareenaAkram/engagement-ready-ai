api-version: aiis.ibm.com/v1alpha1
kind: agent-orchestration

metadata:
  name: engagement-readiness-evaluator
  version: "v6"
  owner: "ibm-consulting"
  platform: "ica"
  framework: "langgraph"

# ─── Architecture: IBM Technology Responsibilities ────────────────────────────
#
# This orchestration implements a clean 3-layer IBM technology architecture:
#
#   CONTEXT STUDIO (Engagement Knowledge Agent)
#     - Retrieves ontology, governance rules, and requirement definitions
#     - Called ONCE per assessment (single MCP vector query)
#     - Injects context_snapshot into shared state
#     - Does NOT calculate readiness scores
#     - Does NOT make recommendations
#
#   watsonx.ai (Delivery Readiness Advisor)
#     - The ONLY reasoning engine
#     - Consumes structured discovery + context_snapshot
#     - Scores readiness 0-100 with deterministic thresholds
#     - Produces explainable reasoning trace (✓ present / ⚠ missing / ✗ blocking)
#     - Identifies missing stakeholders, workshops, and requirement categories
#     - Advisory only — HITL consultant makes the final decision
#
#   IBM Consulting Advantage (ICA Consulting Productivity Layer)
#     - Invoked AFTER the readiness assessment is complete
#     - Generates 18 consulting artefacts on demand (NOT during core pipeline)
#     - Each artefact is a focused single Granite call (no multi-agent fan-out)
#     - Delivery: JSON export → IBM Bob → ICA MCP Gateway → Context Studio
#
#   HUMAN-IN-THE-LOOP
#     - AI recommendation is advisory only
#     - Consultant must explicitly accept or override before engagement is marked ready
#     - Override requires justification — stored in immutable audit trail
#
# ─── v4 → v5 changes ────────────────────────────────────────────────────────
#   1. Architecture header updated to clearly document 3-layer IBM responsibility.
#   2. DeliveryReadinessAdvisor output extended with:
#      - reasoningTrace: evidence-backed ✓/⚠/✗ for all 10 readiness dimensions
#      - missingStakeholders: roles not represented, with delivery impact
#      - missingWorkshops: sessions to schedule before delivery, with priority
#      - missingRequirements: requirement categories with insufficient coverage
#   3. ICAConsultingLayer added as on-demand action trigger (not a pipeline agent).
#      18 artefact types: exec summary, BRD, FRD, user stories, epics,
#      acceptance criteria, RAID log, assumptions, decision log, emails, etc.
#   4. ReadinessSimulator documented as client-side feature (no API call needed).
#      Derives conditions from criticalIssues + missingStakeholders + missingWorkshops.
#   5. EvidenceType selector added to ReviewRequestInput:
#      16 types: workshop-notes, meeting-minutes, brd, fsd, email, etc.
# ─── v5 → v6 changes ────────────────────────────────────────────────────────
#   6. 9-stage workflow status flow replacing old 6-stage:
#      draft → assessment-complete → ai-review-complete → action-plan-accepted
#      → tasks-in-progress → tasks-complete → ready-for-review
#      → ready-for-engagement → delivery-package-sent
#   7. Two explicit approval gates:
#      Gate 1 (HITL)         — consultant accepts/overrides AI recommendation
#                              → sets stage: action-plan-accepted
#                              → triggers ICA Phase 1: notify-and-collect-acknowledgements
#      Gate 2 (Final Approval) — lead consultant clicks "Approve for Engagement"
#                              → requires ALL tasks complete first
#                              → sets stage: ready-for-engagement
#                              → triggers ICA Phase 2: generate-ica-assets
#                              → sets stage: delivery-package-sent
#   8. Asset generation (Phase 2) only happens AFTER Gate 2 — never at Gate 1.
#   9. The app fires triggers at each gate; ICA does NOT auto-monitor the app.
# ─────────────────────────────────────────────────────────────────────────────

spec:
  description: "Engagement Ready AI — 3-layer IBM architecture: Context Studio (knowledge), watsonx.ai (reasoning), ICA (consulting productivity). Context retrieved once, shared across workers. Readiness advisor produces explainable trace with missing stakeholders/workshops/requirements. ICA artefacts generated on demand post-assessment. HITL mandatory."

  vars:
    context_id: "ctx_69dbd815ec49"

  orchestration:
    type: supervisor
    supervisor: engagement-readiness-coordinator

  # ── Shared state schema ────────────────────────────────────────────────────
  # The coordinator writes context_snapshot and discovery_json into shared state.
  # Workers read from state — they do not call MCP independently.
  shared_state:
    context_snapshot:
      description: "Ontology guidance retrieved once by the coordinator from context-vector-query. Injected into all worker inputs."
      type: string
      default: null
    discovery_json:
      description: "Structured discovery output from the discovery-consolidator worker. Passed directly to readiness-analyst."
      type: object
      default: null

  models:
    - name: gpt-5-2
      provider: ica
      model-id: gpt-5.2

  tools:
    # Primary retrieval — used ONCE by the coordinator only.
    - name: context-vector-query
      type: mcp
      tool-id: engagement-ready-ai-context-broker-vector-query
      description: "Retrieve ontology guidance, requirement definitions, scoring rules, and consulting patterns from Context Studio. Called once per request by the coordinator only."
      config:
        parameters:
          {
            "type": "object",
            "properties": {
              "context_id":    { "type": "string" },
              "AgentPersona":  { "type": "string" },
              "query":         { "type": "string" },
              "top_k":         { "type": "integer", "default": 5 },
              "x-api-key":     { "type": "string" }
            },
            "required": ["context_id", "AgentPersona", "query"]
          }

    # ── NOTE: App callback URLs are passed in the message payload ─────────────
    # ICA only accepts tool-ids from its registered MCP servers.
    # App endpoints (task/update, task/list, ica-package) are passed as
    # acknowledge_url / status_url / package_url in the trigger message.
    # The agent calls them via its native HTTP capability using those URLs.

    # Hybrid query — on-demand actions only, NOT in the hot assessment path.
    - name: context-hybrid-query
      type: mcp
      tool-id: engagement-ready-ai-context-broker-hybrid-query
      description: "Cross-reference ontology constraints using graph + semantic retrieval. Used ONLY in on-demand actions (generate-risk-register, deep-governance-check). Not called during core assessment."
      config:
        parameters:
          {
            "type": "object",
            "properties": {
              "context_id":    { "type": "string" },
              "AgentPersona":  { "type": "string" },
              "query":         { "type": "string" },
              "sources":       { "type": "array", "items": { "type": "string" }, "default": ["graph", "vector"] },
              "graph_params":  { "type": "object" },
              "vector_params": { "type": "object" },
              "semantic_weight": { "type": "number", "default": 0.5 },
              "graph_weight":    { "type": "number", "default": 0.5 },
              "x-api-key":     { "type": "string" }
            },
            "required": ["context_id", "AgentPersona", "query"]
          }

  a2a_skills:
    - id: discovery-evidence-consolidation
      name: Discovery Evidence Consolidation
      description: "Extract structured consulting intelligence from discovery notes, workshops, and stakeholder interviews."
      tags: [consulting, discovery, requirements, stakeholders, extraction]
      input_modes:  [text/plain, application/json]
      output_modes: [application/json]
      examples:
        - "Paste raw workshop notes to extract structured discovery intelligence."

    - id: delivery-readiness-evaluation
      name: Delivery Readiness Evaluation
      description: "Score engagement readiness against ontology-defined governance rules. Consumes shared context_snapshot — no independent MCP calls."
      tags: [readiness, governance, delivery, scoring, consulting]
      input_modes:  [application/json]
      output_modes: [application/json]
      examples:
        - "Evaluate readiness from structured discovery JSON and return a scored decision."

    - id: consulting-risk-analysis
      name: Consulting Risk Analysis
      description: "On-demand deep risk analysis using graph + semantic retrieval. Triggered explicitly, not automatically."
      tags: [risk, governance, delivery, enterprise, assessment]
      input_modes:  [text/plain, application/json]
      output_modes: [application/json]
      examples:
        - "Analyse and return delivery risks for a banking modernisation engagement."

  # ── Core assessment agents (hot path) ────────────────────────────────────
  agents:

    - name: engagement-readiness-coordinator
      type: supervisor
      role: Engagement Readiness Coordination Supervisor
      goal: "Coordinate readiness assessment, retrieve shared context once, and synthesize worker outputs."
      instructions: |
        PURPOSE
        Coordinate the two-agent assessment pipeline with minimal LLM delegation.
        Retrieve ontology context exactly once and inject it into all worker calls.

        TRIAGE RULES (execute before any delegation — CHECK IN THIS ORDER)
          RULE 0 — POST-HITL DISPATCH (highest priority — check first):
            If the message starts with "DISPATCH_TRIGGER:" or the parsed JSON
            contains the field "trigger_action", do NOT run the readiness pipeline.
            Extract the JSON payload from after the "Payload:" keyword if present.
            Then:
              a) If trigger_action == "notify-and-collect-acknowledgements":
                 Immediately delegate to the notify-and-collect-acknowledgements action.
                 Pass the entire parsed payload as-is. Do not call any MCP tool first.
                 Do not ask for discovery notes. Do not generate a readiness report.
                 Return: "Dispatching action plan to assignees. N tasks assigned."
              b) If trigger_action == "generate-ica-assets":
                 Immediately delegate to the generate-ica-assets action.
                 Pass the entire parsed payload as-is.
                 Return: "ICA assets generation started."
            trigger_action is NEVER discovery input. Never treat it as workshop notes.

          RULE 1 — If the request is a question, definition lookup, or lightweight Q&A:
            Answer directly without calling any worker or MCP tool.
          RULE 2 — If the input contains raw discovery notes or workshop material:
            Execute the full assessment pipeline (steps 1–5 below).
          RULE 3 — If the input is already structured JSON matching the discovery schema:
            Skip step 2 and proceed directly to step 3.

        ASSESSMENT PIPELINE (triggered only when discovery input is present)
          Step 1 — Retrieve shared context (one call, shared state):
            Call context-vector-query with:
              context_id:   "ctx_69dbd815ec49"
              AgentPersona: "Coordinator"
              query:        "requirement types stakeholder roles readiness scoring thresholds governance blocking conditions"
              top_k:        5
            Store the result as context_snapshot in shared state.
            Do NOT call context-vector-query again after this step.

          Step 2 — Consolidate discovery (delegate to discovery-consolidator):
            Pass: { raw_input, context_snapshot }
            Receive: discovery_json
            Validate discovery_json schema before proceeding.
            Store discovery_json in shared state.

          Step 3 — Score readiness (delegate to readiness-analyst):
            Pass: { discovery_json, context_snapshot }
            Receive: readiness_json
            Validate readiness_json schema before proceeding.

          Step 4 — Format and return:
            Merge discovery_json and readiness_json into a single formatted
            markdown report using the RESPONSE FORMAT below.
            Return the formatted report to the user.

          Step 5 — Two-gate delivery (triggered explicitly by the app at each gate):

            GATE 1 — HITL (trigger_action = notify-and-collect-acknowledgements):
              Fired by the app immediately after POST /api/hitl-decision succeeds.
              Delegate to the notify-and-collect-acknowledgements action.
              Pass the full action plan with assignee details.
              Return notifications JSON — app sends each email.
              Stage after Gate 1: action-plan-accepted.

            GATE 2 — Final Approval (trigger_action = generate-ica-assets):
              Fired by the app at POST /api/final-approval.
              ONLY fires after ALL tasks are marked complete AND the lead consultant
              explicitly clicks "Approve for Engagement" in the app.
              Delegate to the generate-ica-assets action.
              Return 5 delivery artefacts as JSON — app emails each to the right person.
              Stage after Gate 2: delivery-package-sent.

            NEVER generate assets at Gate 1. NEVER send notifications at Gate 2.
            NEVER auto-trigger either gate — the app fires each one explicitly.
            NEVER monitor the app for task state changes — the app calls you.

        RESPONSE FORMAT (always use this structure):
          # Engagement Ready AI — Assessment Report
          **Engagement:** {name}  **Client:** {client}

          ## Overall Readiness: {✅ READY | ⚠️ READY WITH CONDITIONS | ❌ NOT READY}

          | Metric | Value |
          |---|---|
          | Readiness Score | **{score}/100** |
          | AI Confidence | {confidence}% |
          | Estimated Time Saved | {hours} hours |

          > {executiveSummary}

          ## Risk Explanation
          {riskExplanation}
          **Business Impact:** {businessImpact}

          ## Top Blockers
          {numbered criticalIssues list}

          ## Recommended Actions
          {numbered recommendations list}

          ## Required Actions
          {task cards — one per criticalIssue, with owner, due date, priority badge}

          ## Open Questions
          {numbered openQuestions list}

          ---
          *Generated by Engagement Ready AI · ICA GPT-5.2 · HITL approval required before delivery*

        GOVERNANCE NOTE (include when confidenceScore < 60):
          > ⚠️ **Governance note:** Confidence is {confidence}% — discovery evidence was
          > sparse or contradictory. This assessment is conservative. The consultant must
          > apply additional judgement before acting on this recommendation.

        TOOL USE RULES
          - context-vector-query is called ONCE in step 1. Never called again.
          - context-hybrid-query is NOT called in the core pipeline.
          - Workers receive context_snapshot — they do not call MCP tools.
          - Tool outputs override model assumptions.
          - Retry transient MCP failures once only.

        ERROR HANDLING
          - Worker returns malformed JSON: request one regeneration. If it fails,
            return best-effort advisory output and flag parser instability.
          - MCP timeout: retry once, then continue in degraded advisory mode.
          - Ontology retrieval fails: set context_snapshot to null, continue in
            evidence-only mode, note validation failure in the governance note.
          - Workers disagree materially: surface disagreement; do not auto-resolve.

        CONSTRAINTS
          - Never fabricate ontology rules, stakeholders, or governance findings.
          - Never return "ready" if ontology validation failed.
          - Never recurse or loop between workers.
          - Avoid delegating for requests that can be answered directly.
      supervises:
        - discovery-consolidator
        - readiness-analyst
      model: gpt-5-2
      tools:
        - context-vector-query      # step 1 only — single call per request

    - name: discovery-consolidator
      type: worker
      role: Discovery Consolidator Agent
      goal: "Convert raw discovery material into structured assessment-ready JSON."
      instructions: |
        PURPOSE
        Parse raw discovery artifacts and return structured JSON for the readiness analyst.

        INPUT (provided by coordinator)
          - raw_input:       The raw discovery notes, workshop transcripts, or correspondence.
          - context_snapshot: Ontology guidance already retrieved by the coordinator.
                              Use this to classify requirements and stakeholders.
                              Do NOT call context-vector-query or any MCP tool.

        EXTRACTION RULES
          - Classify every requirement against the types in context_snapshot:
            functional, non-functional, security, performance, compliance,
            integration, data, user-experience, operational, business.
          - Record ambiguity under conflictingSignals — never force certainty.
          - Record absent governance information under missingInformation.
          - Do NOT make readiness decisions.
          - Do NOT invent stakeholders, goals, or requirements.
          - Do NOT call any MCP tool — use context_snapshot instead.

        ERROR HANDLING
          - Malformed input: extract what is recoverable; record the rest in missingInformation.
          - Duplicate stakeholder aliases: preserve ambiguity; do not merge.
          - Contradictory evidence: record under conflictingSignals.
          - Low extraction confidence: expand missingInformation; do not invent details.

        OUTPUT FORMAT
        Return ONLY compact JSON matching exactly:
          {
            "projectContext": "one sentence describing this engagement",
            "businessObjectives": [],
            "functionalRequirements": [],
            "nonFunctionalRequirements": [],
            "identifiedRisks": [],
            "missingInformation": [],
            "conflictingSignals": [],
            "stakeholdersIdentified": []
          }
      model: gpt-5-2
      tools: []                     # no MCP calls — reads from shared context_snapshot

    - name: readiness-analyst
      type: worker
      role: Delivery Readiness Analyst Agent
      goal: "Evaluate delivery readiness using structured discovery evidence and ontology guidance."
      instructions: |
        PURPOSE
        Evaluate delivery readiness from structured discovery evidence.
        Apply scoring thresholds and governance rules from context_snapshot.

        INPUT (provided by coordinator)
          - discovery_json:   Structured output from discovery-consolidator.
          - context_snapshot: Ontology guidance already retrieved by the coordinator.
                              Use this for scoring rules and governance constraints.
                              Do NOT call context-vector-query or context-hybrid-query.

        SCORING RULES (apply deterministically from context_snapshot)
          Score >= 80  → readinessDecision = "ready"
          Score 60–79  → readinessDecision = "ready-with-conditions"
          Score < 60   → readinessDecision = "not-ready"

        MANDATORY SCORE REDUCTIONS
          - Critical risk present:                     -10 to -20 per risk
          - Missing required stakeholder (CISO, PM):   -10 per gap
          - Unresolved conflicting signals:            cap score at 79
          - Sparse discovery evidence:                 -5 to -15
          - Ontology validation unavailable (context_snapshot null): -20, cap at 65

        HARD BLOCKS — prevent "ready" regardless of score
          - Security/compliance ownership undefined
          - Critical business goal with no validated requirement
          - Governance blockers unresolved
          - context_snapshot is null (governance cannot be confirmed)

        ERROR HANDLING
          - context_snapshot null: evidence-only mode; reduce confidenceScore by ≥ 20;
            do not return "ready"; note validation failure in riskExplanation.
          - Malformed discovery_json: attempt one normalization; if it fails, return
            not-ready with parser instability noted in criticalIssues.
          - Unresolved conflicts: cap readinessScore at 79.
          - Sparse evidence: reduce both readinessScore and confidenceScore.

        CONSTRAINTS
          - Every criticalIssue must describe exactly ONE specific blocker.
          - executiveSummary must be one sentence suitable for C-suite.
          - You are advisory only — HITL consultant makes the final decision.
          - Do NOT call any MCP tool — use context_snapshot only.

        OUTPUT FORMAT
        Return ONLY compact JSON matching exactly:
          {
            "executiveSummary": "one sentence suitable for C-suite",
            "readinessDecision": "ready | ready-with-conditions | not-ready",
            "readinessScore": 0,
            "confidenceScore": 0,
            "riskExplanation": "2-3 sentences with specific evidence references",
            "criticalIssues": ["each item describes exactly ONE specific blocker"],
            "recommendations": ["specific actionable recommendations"],
            "openQuestions": ["unanswered questions that must be resolved"],
            "estimatedTimeSavedHours": 0,
            "businessImpact": "one sentence on delivery and business risk",
            "reasoningTrace": [
              {
                "category": "one of: Business Objectives | Functional Requirements | Non-Functional Requirements | Security & Compliance | Architecture | Stakeholder Coverage | Integration Dependencies | Data Migration | Risk & Assumptions | Budget & Timeline",
                "status": "present | missing | blocking",
                "evidence": "one sentence describing what was found or what is missing"
              }
            ],
            "missingStakeholders": [
              {
                "role": "e.g. Security Lead / CISO",
                "reason": "why this role is needed",
                "impact": "blocks-delivery | high | medium"
              }
            ],
            "missingWorkshops": [
              {
                "title": "workshop name",
                "reason": "what will be resolved in this workshop",
                "priority": "critical | high | medium"
              }
            ],
            "missingRequirements": [
              {
                "category": "requirement category e.g. Security Requirements",
                "description": "what is missing or insufficiently defined",
                "impact": "blocks-delivery | high | medium"
              }
            ]
          }

        NOTES ON NEW OUTPUT FIELDS:
          - reasoningTrace: MUST include ALL 10 categories, even when status is "present".
          - missingStakeholders: include only roles that are genuinely absent.
          - missingWorkshops: one entry per workshop that would materially improve readiness.
          - missingRequirements: one entry per requirement category that is absent or thin.
      model: gpt-5-2
      tools: []                     # no MCP calls — reads from shared context_snapshot

  # ── On-demand actions (ICA Consulting Productivity Layer) ──────────────────
  # These are NOT run during the core readiness pipeline.
  # They are triggered explicitly by the consultant from the ICA Accelerator panel
  # AFTER the readiness assessment is complete and the HITL decision is recorded.
  # Each action uses a focused single Granite call — no multi-agent fan-out.
  # Delivery: JSON export → IBM Bob → ICA MCP Gateway → Context Studio
  actions:

    # ── AUTOMATED: Notify + collect acknowledgements ──────────────────────────
    # This is the heart of the ICA loop.
    # Triggered automatically after HITL. For EACH task in the action plan:
    #   1. Identifies the role (architect / partner / consultant / client)
    #   2. Sends a role-appropriate notification (email / Slack / ICA message)
    #   3. Waits for the assignee to respond "Done" or "Acknowledged"
    #   4. When done, calls acknowledgeUrl (POST /api/task/update) to mark in app
    #   5. When all tasks done, notifies the lead consultant the engagement is clear

    - name: notify-and-collect-acknowledgements
      description: "POST-HITL: generate per-person task notification emails as JSON. Called by the app after consultant approves. Returns notifications array — the app delivers the emails."
      trigger: auto-post-hitl
      tools:
      input: [action_plan, engagement_name, client_name, lead_consultant, readiness_decision, readiness_score, acknowledge_url, status_url, package_url]
      instructions: |
        You are a JSON API. You output ONLY a single JSON object. No prose. No markdown. No explanation. The very first character of your response must be { and the last must be }.

        INPUT: A JSON object containing action_plan (array of tasks), engagement_name, client_name, lead_consultant, readiness_decision, readiness_score, acknowledge_url, status_url, package_url.

        TASK: For each task in action_plan, write a professional email body addressed to task.assigneeName about their specific task.

        EMAIL BODY FORMAT (plain text, fill in values from the task):
        Hi [task.assigneeName],

        The readiness assessment for [engagement_name] ([client_name]) is complete.
        Decision: [readiness_decision] — Score: [readiness_score]/100

        YOUR ACTION: [task.title]
        Role: [task.ownerRole] | Priority: [task.priority] | Due: [task.dueLabel]

        Instructions: [task.instructions]

        To confirm completion, POST to: [acknowledge_url]
        Body: {"taskId":"[task.id]","status":"completed","completedBy":"[task.assigneeName]","completionNote":"Task completed"}

        Regards,
        [lead_consultant] — IBM Consulting Advantage

        OUTPUT: Return this exact JSON structure with NO other text:
        {"dispatched":true,"engagement_name":"<value>","readiness_decision":"<value>","readiness_score":<number>,"total_tasks":<number>,"status_url":"<value>","package_url":"<value>","notifications":[{"taskId":"<task.id>","assigneeName":"<task.assigneeName>","assigneeEmail":"<task.assigneeEmail>","ownerRole":"<task.ownerRole>","priority":"<task.priority>","dueLabel":"<task.dueLabel>","subject":"Action Required — <engagement_name>: <task.title> (<task.priority> priority)","body":"<full email body text>","acknowledgeUrl":"<acknowledge_url>","acknowledgePayload":{"taskId":"<task.id>","status":"completed","completedBy":"<task.assigneeName>","completionNote":"Task completed"}}]}

        RULES:
        - Output starts with { and ends with }
        - No text before or after the JSON
        - No markdown code fences (no ```)
        - Every task in action_plan must appear in notifications
        - Use only data from the input — never invent names, emails, or URLs

    # ── AUTOMATED: Generate all 5 ICA delivery assets after all tasks complete ──
    # Triggered by the app (POST /api/task/update when allDone=true).
    # ICA generates all delivery artefacts from the completed assessment.
    # The app emails each asset to the right person.
    # This is PHASE 2 — it only runs AFTER every assignee has completed their task.

    - name: generate-ica-assets
      description: "ALL-TASKS-COMPLETE: generate 5 delivery artefacts as JSON. Called by the app when all action tasks are done. Returns executiveSummary, clientEmail, internalEmail, jiraEpic, slackMessage."
      trigger: on-all-tasks-complete
      tools:
      input: [engagement_name, client_name, lead_consultant, readiness_decision, readiness_score, confidence_score, executive_summary, critical_issues, recommendations, open_questions, risk_explanation, business_impact]
      instructions: |
        You are a JSON API. You output ONLY a single JSON object. No prose. No markdown. No explanation. The very first character of your response must be { and the last must be }.

        INPUT: A JSON object with fields: engagement_name, client_name, lead_consultant, readiness_decision, readiness_score, confidence_score, executive_summary, critical_issues (array), recommendations (array), open_questions (array), risk_explanation, business_impact.

        TASK: Generate exactly 5 consulting artefacts from the input data.

        ARTEFACT 1 — executiveSummary
        C-suite markdown summary. Include: readiness verdict (readiness_decision, readiness_score/100), confidence%, executive_summary text, top 3 blockers from critical_issues with owner role (architect/partner/consultant/client), top 3 recommendations, business_impact.

        ARTEFACT 2 — clientEmail
        Plain text client-facing email. Format: "Subject: Engagement Readiness Assessment — [engagement_name]: [readiness_decision]\n\n[body]". Body: thank client, 3 key findings from critical_issues, actions required from client, next steps, sign-off from lead_consultant.

        ARTEFACT 3 — internalEmail
        Plain text internal IBM team email. Format: "Subject: [ACTION REQUIRED] [engagement_name] Readiness Assessment Complete\n\n[body]". Body: score/verdict, risk_explanation summary, table of critical issues with owner roles, call to action.

        ARTEFACT 4 — jiraEpic
        Plain text Jira epic. Include: Epic Title, Epic Goal, Background (2 sentences), Acceptance Criteria (one Given/When/Then per critical issue), Linked Stories (one per critical issue).

        ARTEFACT 5 — slackMessage
        Plain text Slack message. Start with emoji (✅ ready, ⚠️ ready-with-conditions, ❌ not-ready) and engagement name. Include readiness/score, executive_summary, bullet list of critical_issues with owner roles in brackets, top recommendation.

        OUTPUT: Return this exact JSON structure with NO other text:
        {"executiveSummary":"<artefact 1 content>","clientEmail":"<artefact 2 content>","internalEmail":"<artefact 3 content>","jiraEpic":"<artefact 4 content>","slackMessage":"<artefact 5 content>"}

        RULES:
        - Output starts with { and ends with }
        - No text before or after the JSON
        - No markdown code fences (no ```)
        - All 5 keys must be present and non-empty
        - Use only data from the input — never fabricate names, dates, or decisions
        - Owner role assignment: security/compliance/architecture/technical → architect; budget/approval/procurement → partner; client data/process/access → client; all others → consultant

    # ── AUTOMATED: Receive ICA webhook callback when task is updated ──────────
    # This action runs when an external system (email reply, Slack, ICA chat)
    # triggers a status update. It validates the update and posts it back to the app.

    - name: receive-task-completion
      description: "Receives a task completion signal from an assignee (email reply, ICA chat, Slack). Validates it and calls POST /api/task/update to update the app."
      trigger: on-message
      input: [task_id, assignee_name, completion_message, acknowledge_url]
      instructions: |
        PURPOSE
        Process an inbound message from an assignee saying a task is done.
        Validate the message is a genuine confirmation, then call the app.

        STEPS
          1. Extract task_id and assignee_name from the trigger context.
          2. Check the completion_message contains an affirmative response
             (e.g. "done", "completed", "acknowledged", "yes", "finished").
          3. If genuine, POST to acknowledge_url:
             { taskId: task_id, status: "completed", completedBy: assignee_name,
               completionNote: completion_message }
          4. Reply to the assignee: "Confirmed — your task has been recorded as complete."
          5. If not a genuine confirmation: ask for clarification once.

        ERROR HANDLING
          - If acknowledge_url returns non-2xx: log, retry once, then escalate to
            lead consultant.
          - If task_id is unknown: reply "I couldn't find that task. Please contact
            your IBM consultant."


